<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kịch Bản Demo Bảo Vệ SWP391 - Hệ Thống Cho Thuê Kho Self-Storage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #38bdf8;
      --bg: #090d16;
      --card-bg: #0f172a;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --table-header: #1e293b;
      --table-alt: #131d31;
      --badge-bg: rgba(37, 99, 235, 0.15);
      --badge-text: #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 3.5rem;
      border-radius: 20px;
      box-shadow: 0 30px 60px -12px rgba(0,0,0,0.7);
      border: 1px solid var(--border);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .badge-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .badge {
      display: inline-block;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-print {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      padding: 0.65rem 1.4rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(37,99,235,0.35);
    }

    .btn-print:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37,99,235,0.5);
    }

    #content h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 0.5rem;
      border-bottom: 2px solid #2563eb;
      padding-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    #content h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #93c5fd;
      margin-top: 2.5rem;
      margin-bottom: 1.2rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    #content h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #bfdbfe;
      margin-top: 1.8rem;
      margin-bottom: 0.75rem;
    }

    #content h4 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }

    #content p {
      margin-bottom: 1rem;
      color: #cbd5e1;
    }

    #content ul, #content ol {
      margin-bottom: 1.25rem;
      padding-left: 1.5rem;
    }

    #content li {
      margin-bottom: 0.5rem;
      color: #cbd5e1;
    }

    #content table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 1.5rem 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    #content th, #content td {
      padding: 0.85rem 1rem;
      text-align: left;
    }

    #content th {
      background-color: var(--table-header);
      color: #38bdf8;
      font-weight: 700;
      border-bottom: 2px solid #334155;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    #content td {
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    #content tr:nth-child(even) td {
      background-color: var(--table-alt);
    }

    #content tr:hover td {
      background-color: rgba(56, 189, 248, 0.05);
    }

    #content blockquote {
      border-left: 4px solid #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      padding: 1rem 1.25rem;
      margin: 1.25rem 0;
      border-radius: 0 10px 10px 0;
      font-style: italic;
      color: #e0f2fe;
    }

    #content code {
      font-family: 'JetBrains Mono', monospace;
      background: #1e293b;
      color: #38bdf8;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      font-size: 0.88rem;
    }

    #content pre {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      overflow-x: auto;
      margin: 1.5rem 0;
    }

    #content pre code {
      background: transparent;
      padding: 0;
      color: #e2e8f0;
      font-size: 0.9rem;
    }

    .mermaid {
      background: #020617;
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin: 1.5rem 0;
      display: flex;
      justify-content: center;
    }

    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .container { max-width: 100%; box-shadow: none; border: none; padding: 1rem; background: #fff; }
      .toolbar { display: none; }
      #content h1, #content h2, #content h3, #content th { color: #000; border-color: #ccc; }
      #content td { border-color: #ddd; color: #222; }
      #content code { background: #eee; color: #111; }
      #content blockquote { background: #f9f9f9; color: #333; border-color: #666; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="toolbar">
      <div class="badge-wrap">
        <span class="badge">SWP391 CAPSTONE</span>
        <span class="badge" style="border-color:#22c55e; color:#4ade80; background:rgba(34,197,94,0.15);">MASTER DEFENSE SCRIPT</span>
      </div>
      <button class="btn-print" onclick="window.print()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        In / Xuất PDF Hướng Dẫn
      </button>
    </div>
    <div id="content">Đang nạp toàn bộ kịch bản bảo vệ đồ án...</div>
  </div>

  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    fetch('SWP391_Kich_Ban_Demo_Chi_Tiet_Bao_Ve.md')
      .then(response => {
        if (!response.ok) throw new Error('Không thể tải file SWP391_Kich_Ban_Demo_Chi_Tiet_Bao_Ve.md.');
        return response.text();
      })
      .then(markdown => {
        const renderer = new marked.Renderer();
        const originalCode = renderer.code.bind(renderer);
        
        renderer.code = function(code, language) {
          if (language === 'mermaid') {
            return `<div class="mermaid">${code}</div>`;
          }
          return originalCode(code, language);
        };

        marked.setOptions({
          renderer: renderer,
          breaks: true,
          gfm: true
        });

        document.getElementById('content').innerHTML = marked.parse(markdown);
        mermaid.init(undefined, document.querySelectorAll('.mermaid'));
      })
      .catch(err => {
        document.getElementById('content').innerHTML = `
          <div style="color: #ef4444; padding: 2rem; text-align: center;">
            <h2>Đã xảy ra lỗi khi tải tài liệu</h2>
            <p>${err.message}</p>
            <p>Vui lòng xem trực tiếp file <code>docs/SWP391_Kich_Ban_Demo_Chi_Tiet_Bao_Ve.md</code>.</p>
          </div>
        `;
      });
  </script>
</body>
</html>
