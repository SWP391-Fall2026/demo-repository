<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Facility & Unit Service View</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body style="padding:24px; background:#f8fafc;">
  <div class="ui-card">
    <div class="ui-card-header">
      <h3 class="ui-card-title">🏢 Facility & Unit Management Service</h3>
      <span class="badge badge-teal">Module 5 & 6: Facilities & Units</span>
    </div>
    <p style="font-size:13px; color:#64748b; margin-bottom:16px;">
      Service quản lý 5 cơ sở kho toàn quốc, 4 gói kích thước (S/M/L/Kho mát) và ma trận trạng thái phòng kho thời gian thực.
    </p>
    <div class="matrix-grid" id="matrixContainer">Đang tải ma trận kho...</div>
  </div>

  <script>
    fetch('/api/facilities/units')
      .then(res => res.json())
      .then(data => {
        const cells = data.data.map(u => `
          <div class="matrix-cell ${u.status}">
            <div style="font-weight:800; font-size:15px;">${u.code}</div>
            <div style="font-size:11px;">${u.size}</div>
            <div style="font-size:10px; font-weight:700; text-transform:uppercase;">${u.status}</div>
          </div>
        `).join('');
        document.getElementById('matrixContainer').innerHTML = cells;
      });
  </script>
</body>
</html>
