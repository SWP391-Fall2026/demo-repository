# Loaded only after operator approval; no embedded credentials or schema writes.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
app.scheduling.enabled=${APP_SCHEDULING_ENABLED:true}
app.reservation.pending-payment-minutes=${RESERVATION_PENDING_PAYMENT_MINUTES:5}
app.reservation-monitor-ms=${RESERVATION_MONITOR_MS:5000}
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
app.auth.schema-reviewed=${AUTH_SCHEMA_REVIEWED:false}
app.auth.password-max-bytes=72
app.auth.otp-delivery=email
app.auth.mail-from=${AUTH_MAIL_FROM:}
spring.mail.host=${AUTH_SMTP_HOST:}
spring.mail.port=${AUTH_SMTP_PORT:587}
spring.mail.username=${AUTH_SMTP_USERNAME:}
spring.mail.password=${AUTH_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
