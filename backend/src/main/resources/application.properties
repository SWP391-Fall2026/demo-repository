# Load local root .env during development; deployment environment variables still take precedence.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=8080

# Comma-separated browser origins allowed to call API with credentials.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# CẤU HÌNH DATABASE (HỖ TRỢ CẢ SUPABASE POSTGRESQL VÀ LOCAL DB):
spring.datasource.url=${DATABASE_URL:${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}}
spring.datasource.username=${DATABASE_USERNAME:${SUPABASE_DB_USER:postgres.xnerbsgbwdpemvnatvuy}}
spring.datasource.password=${DATABASE_PASSWORD:${SUPABASE_DB_PASSWORD:SWP_FALL2026}}
