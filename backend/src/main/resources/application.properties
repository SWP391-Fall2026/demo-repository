# Load local root .env during development; deployment environment variables still take precedence.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=8080

# CẤU HÌNH KẾT NỐI POSTGRESQL / SUPABASE
# Dùng Supabase Database URL hoặc Pooler URL (khuyến nghị Pooler khi port 5432 timeout).
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.xnerbsgbwdpemvnatvuy.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.driver-class-name=org.postgresql.Driver

# HIBERNATE / JPA CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (JSON WEB TOKEN) SECURITY CONFIGURATION
jwt.secret=swp391_self_storage_super_secret_jwt_key_2026_@#!4857648234857623847562834
jwt.expiration=86400000

# LOGGING
logging.level.org.springframework.web=INFO
logging.level.com.swp391.selfstorage=INFO
