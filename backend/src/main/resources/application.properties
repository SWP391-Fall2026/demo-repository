spring.application.name=storage-rental
# Support Maven launched from either the backend directory or repository root.
# Local file is git-ignored; deployed environments use environment variables.
spring.config.import=optional:file:../storage-rental-secrets/backend.properties,optional:file:../../storage-rental-secrets/backend.properties,optional:file:storage-rental-secrets/backend.properties
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/storage_rental}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
app.upload-dir=${APP_UPLOAD_DIR:../var/uploads}
app.frontend-url=${APP_FRONTEND_URL:http://127.0.0.1:5174}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5174,http://127.0.0.1:5174}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.tmn-code=${VNPAY_TMN_CODE:4CN4OEVW}
vnpay.hash-secret=${VNPAY_HASH_SECRET:VMSAJHTKAKTLQOJQLNGMYRVPHHWHOJMT}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8000/api/payments/vnpay/return}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.reservation.pending-payment-minutes=${RESERVATION_PENDING_PAYMENT_MINUTES:5}
app.reservation-monitor-ms=${RESERVATION_MONITOR_MS:5000}
