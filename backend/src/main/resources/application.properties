# ==============================================================================
# SELF-STORAGE FACILITY RENTAL SYSTEM - SPRING BOOT CONFIGURATION
# ==============================================================================

# Load local root .env during development; deployment environment variables still take precedence.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=8080

# CẤU HÌNH DATABASE:
# Mặc định sử dụng H2 Database lưu file trên ổ cứng (./data/selfstorage;MODE=PostgreSQL).
# -> Không lo bị lỗi mạng/timeout cổng 5432, lưu vĩnh viễn trên ổ cứng, reset/tắt máy dữ liệu vẫn còn 100%.
# Nếu muốn dùng PostgreSQL / Supabase, chỉ cần khai báo SUPABASE_DB_URL hoặc DATABASE_URL trong .env!
spring.datasource.url=${DATABASE_URL:${SUPABASE_DB_URL:jdbc:h2:file:./data/selfstorage;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL}}
spring.datasource.username=${DATABASE_USERNAME:${SUPABASE_DB_USER:sa}}
spring.datasource.password=${DATABASE_PASSWORD:${SUPABASE_DB_PASSWORD:}}
spring.datasource.hikari.connection-timeout=10000

# HIBERNATE / JPA CONFIGURATION (Tự động thích ứng Dialect theo database được nạp)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CẤU HÌNH GỬI EMAIL THẬT (GMAIL SMTP HOẶC DỊCH VỤ SMTP BẤT KỲ)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from-name=${MAIL_FROM_NAME:STORAGE System}

# JWT (JSON WEB TOKEN) SECURITY CONFIGURATION
jwt.secret=swp391_self_storage_super_secret_jwt_key_2026_@#!4857648234857623847562834
jwt.expiration=86400000

# LOGGING
logging.level.org.springframework.web=INFO
logging.level.com.swp391.selfstorage=INFO
